<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
  </defs>
  <!-- bezel -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="#000" stroke="#2a2e36" stroke-width="3"/>
  <!-- screen -->
  <rect x="8" y="8" width="48" height="48" rx="7" fill="url(#screen)"/>
  <!-- scanlines -->
  <g fill="#ffffff" opacity="0.03">
    <rect x="8" y="14" width="48" height="1.5"/>
    <rect x="8" y="22" width="48" height="1.5"/>
    <rect x="8" y="30" width="48" height="1.5"/>
    <rect x="8" y="38" width="48" height="1.5"/>
    <rect x="8" y="46" width="48" height="1.5"/>
  </g>
  <!-- status bar -->
  <rect x="8" y="47" width="48" height="9" rx="4.5" fill="#e8b15a"/>
  <rect x="12" y="50.2" width="14" height="2.6" rx="1.3" fill="#000000" opacity="0.85"/>
  <!-- prompt -->
  <text x="13" y="33" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace"
        font-size="22" font-weight="600" fill="#e8b15a">&gt;</text>
  <text x="25" y="35" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace"
        font-size="22" font-weight="600" fill="#7fbf7f">_</text>
</svg>
